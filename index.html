<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Ficha do Conselho</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #f8f9fa; font-family: system-ui, -apple-system, sans-serif; font-size: 0.88rem; }
        .card-custom { border: 1px solid #e3e6f0; border-radius: 8px; background: white; }
        .nota-vermelha { color: #dc3545; font-weight: bold; }
        .nota-verde { color: #198754; font-weight: bold; }
        .linha-selecionada { background-color: #e2eefd !important; }
    </style>
</head>
<body class="p-3">

    <div class="card card-custom p-3 mb-3">
        <div class="row align-items-center">
            <div class="col-md-4">
                <label class="fw-bold text-secondary">Selecionar Aluno:</label>
                <select id="selectAluno" class="form-select form-select-sm" onchange="carregarAluno()"></select>
            </div>
            <div class="col-md-5">
                <h5 class="fw-bold mb-0" id="txtNome">---</h5>
                <small class="text-muted">Prontuário: <span id="txtProntuario">---</span> | Turma: <span id="txtTurma">---</span></small>
            </div>
            <div class="col-md-3 text-end">
                <button class="btn btn-sm btn-outline-primary fw-bold" onclick="atualizarPainelViaJson()">
                    <i class="bi bi-arrow-clockwise"></i> Atualizar Painel (JSON)
                </button>
            </div>
        </div>
    </div>

    <div class="row g-2 mb-3">
        <div class="col-3"><div class="card card-custom p-2 text-center">Média Geral<h3 id="kpiMedia">0.0</h3></div></div>
        <div class="col-3"><div class="card card-custom p-2 text-center">Frequência<h3 id="kpiFreq">0%</h3></div></div>
        <div class="col-3"><div class="card card-custom p-2 text-center">Retenções (&lt;6.0)<h3 id="kpiRet" class="text-danger">0</h3></div></div>
        <div class="col-3"><div class="card card-custom p-2 text-center">NAPNE<h3 id="kpiNapne" class="text-warning">NÃO</h3></div></div>
    </div>

    <div class="row g-3">
        <div class="col-md-7">
            <div class="card card-custom p-3">
                <h6 class="fw-bold text-secondary">Disciplinas</h6>
                <div class="table-responsive">
                    <table class="table table-sm table-hover align-middle">
                        <thead>
                            <tr>
                                <th>Disciplina</th>
                                <th class="text-center">B1</th>
                                <th class="text-center">B2</th>
                                <th class="text-center">B3</th>
                                <th class="text-center">B4</th>
                                <th class="text-center">Média</th>
                            </tr>
                        </thead>
                        <tbody id="tbodyDisp"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-md-5">
            <div class="card card-custom p-3">
                <h6 class="fw-bold text-secondary" id="txtTituloDisp">Desempenho por Bimestre</h6>
                <div style="height: 180px;"><canvas id="chartNotas"></canvas></div>
                <hr>
                <label class="fw-bold text-secondary">Parecer NAPNE / Inclusão:</label>
                <div class="p-2 bg-light rounded text-secondary border mb-2" id="txtNapneInfo">---</div>
                <label class="fw-bold text-secondary">Deliberação do Conselho:</label>
                <textarea class="form-control form-control-sm mb-2" id="txtObs" rows="3"></textarea>
                <button class="btn btn-sm btn-primary w-100 fw-bold" onclick="salvarObs()">Salvar Deliberação</button>
            </div>
        </div>
    </div>

    <script>
        const banco = __DADOS_JSON_INJETADOS__;
        let chartInstance = null;

        function init() {
            const select = document.getElementById('selectAluno');
            select.innerHTML = '';
            if (!banco || banco.length === 0) {
                select.innerHTML = '<option>Nenhum aluno carregado</option>';
                return;
            }
            banco.forEach((a, i) => {
                select.innerHTML += `<option value="${i}">${a.nome} (${a.prontuario})</option>`;
            });
            carregarAluno();
        }

        // Atividade 2: Atualização pelo JSON
        function atualizarPainelViaJson() {
            window.location.reload();
        }

        function carregarAluno() {
            const idx = document.getElementById('selectAluno').value;
            const a = banco[idx];
            if (!a) return;

            document.getElementById('txtNome').innerText = a.nome;
            document.getElementById('txtProntuario').innerText = a.prontuario;
            document.getElementById('txtTurma').innerText = a.turma;
            document.getElementById('kpiFreq').innerText = a.frequencia.toFixed(1) + '%';
            document.getElementById('kpiNapne').innerText = a.napne ? "SIM" : "NÃO";
            document.getElementById('txtNapneInfo').innerText = a.pneInfo;
            document.getElementById('txtObs').value = a.deliberacao || '';

            const tbody = document.getElementById('tbodyDisp');
            tbody.innerHTML = '';

            let somaMedias = 0;
            let qtdMedias = 0;
            let retencoes = 0;

            a.disciplinas.forEach((d, i) => {
                const vals = [d.b1, d.b2, d.b3, d.b4].filter(n => n !== null && n !== undefined);
                const media = vals.length > 0 ? (vals.reduce((p, c) => p + c, 0) / vals.length) : 0;
                
                if (vals.length > 0) {
                    somaMedias += media;
                    qtdMedias++;
                    if (media < 6.0) retencoes++;
                }

                tbody.innerHTML += `
                    <tr onclick="plotarGrafico('${d.nome}', [${d.b1||0}, ${d.b2||0}, ${d.b3||0}, ${d.b4||0}])">
                        <td>${d.nome}</td>
                        <td class="text-center">${d.b1 ?? '-'}</td>
                        <td class="text-center">${d.b2 ?? '-'}</td>
                        <td class="text-center">${d.b3 ?? '-'}</td>
                        <td class="text-center">${d.b4 ?? '-'}</td>
                        <td class="text-center ${media < 6.0 ? 'nota-vermelha' : 'nota-verde'}">${media.toFixed(1)}</td>
                    </tr>
                `;
            });

            document.getElementById('kpiMedia').innerText = qtdMedias > 0 ? (somaMedias / qtdMedias).toFixed(1) : "0.0";
            document.getElementById('kpiRet').innerText = retencoes;

            if (a.disciplinas.length > 0) {
                const d0 = a.disciplinas[0];
                plotarGrafico(d0.nome, [d0.b1||0, d0.b2||0, d0.b3||0, d0.b4||0]);
            }
        }

        function plotarGrafico(nome, notas) {
            document.getElementById('txtTituloDisp').innerText = nome;
            const ctx = document.getElementById('chartNotas').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['B1', 'B2', 'B3', 'B4'],
                    datasets: [{ label: 'Notas', data: notas, backgroundColor: '#0d6efd' }]
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 10 } } }
            });
        }

        function salvarObs() {
            const idx = document.getElementById('selectAluno').value;
            const a = banco[idx];
            const obs = document.getElementById('txtObs').value;
            if (a) {
                const urlPai = window.parent.location.href.split('?')[0];
                window.parent.location.href = `${urlPai}?action=salvar_obs&aluno=${encodeURIComponent(a.nome)}&obs=${encodeURIComponent(obs)}`;
            }
        }

        window.onload = init;
    </script>
</body>
</html>
